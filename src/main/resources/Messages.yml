    debugCaches: "$3Caches: $1%profiles%$3 profiles ($1%loading%$3 loading), $1%boards%$3 leaderboards, $1%smelt%$3 smelt / $1%block%$3 block recipes"
    debugWand: "$3Wand selections: $1%selections%$3, pending teleports: $1%teleports%"
