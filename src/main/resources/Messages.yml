    debugMines: "$3Loaded mines: $1%mines%"
    debugIndex: "$3Index: $1%worlds%$3 worlds, $1%chunks%$3 chunks, $1%entries%$3 entries"
    debugResets: "$3Resets: $1%active%$3 active, $1%paused%$3 paused, $1%instant%$3 instant, $1%wave%$3 wave"
