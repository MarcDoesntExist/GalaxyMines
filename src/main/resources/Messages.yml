colors:
  primaryColor: '5'
  secondaryColor: 'f'
  neutralColor: '7'
  warningColor: 'c'
  enableCustomColors: false
  custom:
    5: '6'
    6: 'd'

messages:
  messagePrefix: "$1&lGalaxy$2&lMines"
  messageSeparator: " &8» "
  header: "$4&m----&r %prefix% $4&m----"
  mineCreate: "$1The mine $2&l%mine% $1has been created."
  mineReset: "%prefix%%separator%$1The mine $2&l%alias% $1is resetting."
  noPermission: "$4You do not have permission to use this command"
  invalidArguments: "$4Invalid command"
  bossbar: "$3%mine% $8- $2%percent%%%$8 remaining $8- reset in $2%resettime%"
  mine:
    accessDenied: "$4You do not have access to the mine $2%mine%$4."
    breakDenied: "$4You cannot break blocks in the mine $2%mine%$4."
    compositionProtected: "$4Only blocks from this mine's composition can be broken here."
    outsideProtected: "$4You cannot break blocks in this managed world outside a mine."
    constraintBreakDenied: "$4This block cannot be broken in this mine."
    constraintPlaceDenied: "$4You cannot place this block in this mine."
    teleported: "$1Teleported to the mine $2%mine%$1."
    teleportFailed: "$1The teleport to $2%mine%$1 was cancelled."
    spawnSet: "$1Spawn point for $2%mine%$1 set to your current location."
    paused: "$1The mine $2%mine%$1 is paused."
    resumed: "$1The mine $2%mine%$1 is active again."
    stats: "$3%mine%$1: $2%remaining%$1 blocks remaining, $2%percent%%%$1 mined, $2%resets%$1 resets."
    tierUp: "$1The mine $2%mine%$1 reached tier $2%level%$1!"
    tierHeader: "$3Tier of $2%mine%$3:"
    tierDisabled: "$3Progression is disabled for this mine."
    tierLevel: "$3Level $1%level%$3/$1%max%$3, $1%mined%$3 mined blocks, next level in $1%remaining%$3."
    tierBonus: "$3Bonus: $2%drop%%%$3 drops, $2%sell%%%$3 sell ($1%progress%%%$3 of the level)."
    inventoryFull: "$4Your inventory is full and this mine uses auto-pickup."
    teleportWarmup: "$1Teleporting to $2%mine%$1 in $2%seconds%$1 seconds. Do not move."
    teleportCancelled: "$4Mine teleport cancelled because you moved."
    teleportCooldown: "$4Wait $2%seconds%$4 seconds before teleporting again."
  reset:
    countdown: "$1The mine $2%alias%$1 resets in $2%seconds%$1 seconds."
    countdownTitle: "$1%alias%"
    countdownActionBar: "$1Reset in $2%seconds%s"
    resetCooldown: "$4This mine cannot be reset again yet."
  command:
    currenciesHeader: "$3Registered currencies: $1%count%$3 (default: $1%default%$3)"
    currencyEntry: "$3- $1%id%$3 ($2%name%$3): $1%state%$1%default%"
    currencyAvailable: "available"
    currencyUnavailable: "unavailable"
    currencyDefaultTag: " [default]"
    consoleOnly: "$4You cannot use this command from the console"
    noPermission: "$4You do not have permission to use this command"
    usage:
      - "$2&m----------$4♦ $1GalaxyMines $4♦$2&m----------"
      - "$3➣ $2/mine $1create (name) [resetDelay] [broadcast] [nearby] [radius] [message]"
      - "$3➣ $2/mine $1tp (name)"
      - "$3➣ $2/mine $1setspawn (name)"
      - "$3➣ $2/mine $1pause|resume (name)"
      - "$3➣ $2/mine $1stats (name)"
      - "$3➣ $2/mine $1currencies"
      - "$3➣ $2/mine $1prices"
      - "$3➣ $2/mine $1prices gui"
      - "$3➣ $2/mine $1milestones (player)"
      - "$3➣ $2/mine $1providers"
      - "$3➣ $2/mine $1delete (name)"
      - "$3➣ $2/mine $1info (name)"
      - "$3➣ $2/mine $1rename (name) (newName)"
      - "$3➣ $2/mine $1clone (name) (newName)"
      - "$3➣ $2/mine $1edit (name)"
      - "$3➣ $2/mine $1list"
      - "$3➣ $2/mine $1reset (name|all)"
      - "$3➣ $2/mine $1resetall confirm"
      - "$3➣ $2/mine $1wand"
      - "$3➣ $2/mine $1top [daily|weekly|all]"
      - "$3➣ $2/mine $1mystats [player]"
      - "$3➣ $2/mine $1leaderboard [daily|weekly|all]"
      - "$3➣ $2/mine $1event list|start|stop (id)|reload"
      - "$3➣ $2/mine $1luckyblocks reload|validate"
      - "$3➣ $2/mine $1debug"
      - "$3➣ $2/mine $1gui"
      - "$3➣ $2/mine $1reload"
      - "$2&m--------------------------------"
    editUsage:
      - "$2&m----------$4♦ $1GalaxyMines $4♦$2&m----------"
      - "$3➣ $2/mine $1edit (name) add (material) (0-100)"
      - "$3➣ $2/mine $1edit (name) remove (material)"
      - "$3➣ $2/mine $1edit (name) set (alias|resetdelay|nearbybroadcast|broadcastRange) (value)"
      - "$3➣ $2/mine $1edit (name) set (resetpercent|resetminpercent|resetmaxpercent) (0-100)"
      - "$3➣ $2/mine $1edit (name) set resetcheck (ticks)"
      - "$3➣ $2/mine $1edit (name) commands (pre|post) (add|remove|list) [command|index]"
      - "$3➣ $2/mine $1edit (name) constraints (break|place) (allow|deny|clear|list) [material]"
      - "$3➣ $2/mine $1edit (name) set (wavespeed|wavedirection) (value)"
      - "$3➣ $2/mine $1edit (name) set (currency|sellpriority) (value)"
      - "$3➣ $2/mine $1tier (name) [setlevel|addblocks] (value)"
      - "$3➣ $2/mine $1expand (name) (blocks) [confirm]"
      - "$2&m--------------------------------"
    invalidName: "$4Invalid name: letters, numbers, '_' and '-' (max %max%)."
    mineExists: "$4A mine named $2%mine%$4 already exists."
    noSelection: "$4Select a region with WorldEdit first."
    invalidNumber: "$4%value% is not a valid number."
    resetDelayTooLow: "$4Reset delay must be at least 1 minute."
    radiusTooLow: "$4Radius must be greater than 0."
    specifyMine: "$4Specify the mine name."
    specifyMaterial: "$4Specify a material."
    invalidMaterial: "$4%value% is not a valid material."
    invalidBlock: "$4%value% is not a valid block."
    customBlockUnavailable: "$4Custom block %value% is not available. Install its provider plugin and retry."
    specifyPercentage: "$4Specify a percentage."
    specifyParameter: "$4Specify a parameter."
    unknownParameter: "$4Unknown parameter: use alias, resetdelay, resetpercent, resetminpercent, resetmaxpercent, resetcheck, wavespeed, wavedirection, currency, sellpriority, nearbybroadcast or broadcastRange."
    success: "$1Change applied successfully."
    mineDeleted: "$1The mine $2%mine% $1has been deleted."
    mineNotFound: "$4Could not find mine $2%mine%$4."
    mineReset: "$1The mine $2%mine% $1has been reset."
    allMinesReset: "$1All mines have been reset."
    regionInfo: "$2WorldEdit region: $4%region%"
    unsupportedRegion: "$4Region $1%region%$4 is not supported."
    mineOverlap: "$4A mine already exists at this location."
    existingMines: "$3Existing mines: $1%mines%"
    mineDoesNotContain: "$4Mine $2%mine%$4 does not contain $2%material%$4."
    specifyAlias: "$4Specify the alias to set for the mine."
    specifyDelay: "$4Specify the delay in minutes."
    specifyBoolean: "$4Specify true or false."
    specifyRadius: "$4Specify a radius."
    specifyNumber: "$4Specify a number."
    resetPercentSet: "$1Reset threshold of $2%mine%$1 set to $2%value%%$1."
    resetRangeSet: "$1Reset threshold range of $2%mine%$1 set to $2%min%%$1-$2%max%%$1."
    resetCheckSet: "$1Reset percentage check interval of $2%mine%$1 set to $2%ticks%$1 tick(s)."
    resetCommandPhase: "$4Specify pre or post."
    resetCommandAction: "$4Specify add, remove or list."
    resetCommandIndex: "$4%value% is not a valid command index."
    resetCommandsHeader: "$3Reset commands of $2%mine%$3 ($2%phase%$3):"
    resetCommandsEmpty: "$3No $2%phase%$3 reset commands are configured."
    resetCommandEntry: "$3- $1%command%$3 (#%index%)"
    resetCommandAdded: "$1Added the $2%phase%$1 reset command: $2%command%"
    resetCommandRemoved: "$1Removed the $2%phase%$1 reset command #$2%index%$1."
    constraintUsage: "$3Usage: $1/mine edit %mine% constraints (break|place) (allow|deny|clear|list) [material]"
    constraintList: "$3%section% constraints of $2%mine%$3: allow [$1%allow%$3], deny [$1%deny%$3], place checks $1%state%"
    constraintChanged: "$1%action% $2%material%$1 in the $2%section%$1 constraints of $2%mine%$1."
    constraintCleared: "$1Cleared the $2%section%$1 constraints of $2%mine%$1."
    constraintPlaceState: "$1Placement constraints for $2%mine%$1 are now $2%state%$1."
    waveSpeedSet: "$1Layer speed of $2%mine%$1 set to $2%layers%$1 layer(s) per tick (0 = global)."
    waveDirectionSet: "$1Wave direction of $2%mine%$1 set to $2%direction%$1."
    waveDirectionInvalid: "$4Invalid direction: use top or bottom."
    specifyCurrency: "$4Specify a currency: %currencies%."
    currencyUnknown: "$4%value% is not a registered currency. Available: %currencies%."
    currencySet: "$1Sell currency of $2%mine%$1 set to $2%currency%$1."
    sellPriorityInvalid: "$4Invalid priority: use provider, material, highest or global."
    sellPrioritySet: "$1Sell priority of $2%mine%$1 set to $2%priority%$1."
    tierUsage: "$3Usage: $1/mine tier %mine% [setlevel (n)|addblocks (n)]"
    tierSet: "$1Tier of $2%mine%$1 set to $2%level%$1."
    tierAdded: "$1Added $2%blocks%$1 blocks to $2%mine%$1: tier $2%level%$1."
    expandUsage: "$3Usage: $1/mine expand (name) (blocks) [confirm]"
    expandConfirm: "$3Mine $2%mine%$3 would grow by $2%blocks%$3 blocks per side (new volume $1%volume%$3). Run $1/mine expand %mine% %blocks% confirm$3."
    expandDone: "$1Mine $2%mine%$1 expanded by $2%blocks%$1 blocks per side, new volume $1%volume%$1."
