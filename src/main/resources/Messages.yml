    debugStatistics: "$3Statistics enabled: $1%enabled%"
    debugEvents: "$3Active events: $1%events%"
    debugHolograms: '<gray>Holograms: <white>%enabled%<gray>, orphan cleanup <white>%when%<gray> ago, removed <white>%removed%'
