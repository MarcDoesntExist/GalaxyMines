    expandOverlap: "$4Mine $2%mine%$4 would overlap another mine."
    expandTooLarge: "$4Mine $2%mine%$4 would exceed the maximum mine volume."
    reloading: "$3Reloading configuration..."
    reloaded: "$1Configuration reloaded."
    reloadFailed: "$4Reload failed: WorldEdit is not available."
    playerOnly: "$4This command can only be used by a player."
    specifyPlayer: "$4Specify a player name."
    playerNotFound: "$4Could not find player $2%player%$4."
    noMines: "$3There are no loaded mines."
    renameUsage: "$3Usage: $1/mine rename (name) (newName)"
    cloneUsage: "$3Usage: $1/mine clone (name) (newName)"
    mineRenamed: "$1Mine $2%old%$1 has been renamed to $2%new%$1."
    renameFailed: "$4The mine $2%mine%$4 could not be renamed to $2%newName%$4."
    mineCloned: "$1Mine $2%source%$1 has been cloned to $2%mine%$1."
    cloneFailed: "$4The mine $2%mine%$4 could not be cloned ($4%reason%$4)."
    resetAllConfirm: "$3This resets every mine. Run $1/mine resetall confirm$3 to continue."
    eventUsage: "$3Usage: $1/mine event start|stop (id)"
    eventUnknown: "$4Unknown event $2%event%$4."
    eventNotActive: "$4The event $2%event%$4 is not active."
    eventStarted: "$1Event $2%event%$1 started."
    eventStopped: "$1Event $2%event%$1 stopped."
    eventReloaded: "$1Loaded $2%count%$1 event definition(s)."
    luckyBlocksUsage: "$3Usage: $1/mine luckyblocks reload|validate"
